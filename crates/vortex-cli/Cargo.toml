[package]
name = "vortex-cli"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "JSON interface the Vortex Godot shell uses"

[[bin]]
name = "vortex-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
vortex-core = { path = "../vortex-core" }
